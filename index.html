<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LIVE00 | Sobriety Tracker & Neuro-Recovery Engine</title>
    <meta name="description" content="Plataforma de recuperación y sobriedad con reloj tabular a tiempo real, hitos biológicos, modo SOS y comunidad por cohortes." />
    
    <!-- PWA & Mobile Standalone -->
    <link rel="manifest" href="/manifest.json?v=3" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LIVE00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="LIVE00" />

    <!-- Google Fonts: Outfit & Plus Jakarta Sans & JetBrains Mono (para tabular-nums del reloj) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('LIVE00 PWA ServiceWorker registrado:', reg.scope);
          }).catch((err) => {
            console.log('Error registrando ServiceWorker:', err);
          });
        });
      }
    </script>
  </body>
</html>
