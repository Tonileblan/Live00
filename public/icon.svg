<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radiant Emerald to Cyan Gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Translucent Emerald Inner Fill -->
    <linearGradient id="innerFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Soft Glow Filter (tight bounds so edges remain completely clean) -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 100% TRANSPARENT BACKGROUND - NO WHITE, NO BLACK, ZERO BOUNDING BOXES -->
  <g transform="translate(256, 256) scale(1.18)" filter="url(#softGlow)">
    <!-- Outer Recovery Shield -->
    <path d="M 0 -150 
             C 95 -150 150 -115 150 -20 
             C 150 90 60 160 0 190 
             C -60 160 -150 90 -150 -20 
             C -150 -115 -95 -150 0 -150 Z" 
          fill="url(#innerFill)" 
          stroke="url(#shieldGradient)" 
          stroke-width="18" 
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Central Recovery Flame / Spark Core -->
    <path d="M 0 -95 
             C 32 -50 48 -15 40 24 
             C 32 60 0 90 0 90 
             C 0 90 -32 60 -40 24 
             C -48 -15 -32 -50 0 -95 Z" 
          fill="url(#shieldGradient)"
          opacity="0.95"/>

    <!-- Central Spark Star (Emerald-Mint tinted, zero harsh white) -->
    <polygon points="0,-20 12,0 0,20 -12,0" fill="#6EE7B7" opacity="0.95"/>
  </g>
</svg>
