<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#151D2C"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Shield Shape -->
    <path d="M 0 -150 C 90 -150 140 -110 140 -20 C 140 90 60 150 0 180 C -60 150 -140 90 -140 -20 C -140 -110 -90 -150 0 -150 Z" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="18" 
          stroke-linejoin="round"/>

    <!-- Inner Core: Spark / Flame of Sobriety -->
    <path d="M 0 -80 C 30 -40 45 -10 40 25 C 35 60 0 85 0 85 C 0 85 -35 60 -40 25 C -45 -10 -30 -40 0 -80 Z" 
          fill="url(#glowGrad)"/>

    <!-- 00 Emblem for LIVE00 -->
    <text x="0" y="38" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#FFFFFF" 
          text-anchor="middle">00</text>
  </g>
</svg>
