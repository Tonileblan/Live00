<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#161F30"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>

    <!-- Emerald to Cyan Radiant Gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Subtle Inner Fill Gradient -->
    <linearGradient id="innerFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- SINGLE UNIFIED SHIELD & RECOVERY EMBLEM -->
  <g transform="translate(256, 256)" filter="url(#softGlow)">
    <!-- Outer Protective Shield -->
    <path d="M 0 -140 
             C 85 -140 135 -105 135 -15 
             C 135 85 55 145 0 175 
             C -55 145 -135 85 -135 -15 
             C -135 -105 -85 -140 0 -140 Z" 
          fill="url(#innerFill)" 
          stroke="url(#shieldGradient)" 
          stroke-width="14" 
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Central Recovery Flame / Spark Core (One unified icon) -->
    <path d="M 0 -85 
             C 28 -45 42 -12 36 22 
             C 30 55 0 80 0 80 
             C 0 80 -30 55 -36 22 
             C -42 -12 -28 -45 0 -85 Z" 
          fill="url(#shieldGradient)"
          opacity="0.95"/>

    <!-- Central Diamond Star of Clarity -->
    <polygon points="0,-18 10,0 0,18 -10,0" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
