<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Emerald to Cyan Radiant Gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Subtle Inner Fill Gradient -->
    <linearGradient id="innerFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND (No boxes, no outer borders) -->
  <g transform="translate(256, 256) scale(1.18)" filter="url(#softGlow)">
    <!-- Outer Protective Shield -->
    <path d="M 0 -150 
             C 95 -150 150 -115 150 -20 
             C 150 90 60 160 0 190 
             C -60 160 -150 90 -150 -20 
             C -150 -115 -95 -150 0 -150 Z" 
          fill="url(#innerFill)" 
          stroke="url(#shieldGradient)" 
          stroke-width="18" 
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Central Recovery Flame / Spark Core -->
    <path d="M 0 -95 
             C 32 -50 48 -15 40 24 
             C 32 60 0 90 0 90 
             C 0 90 -32 60 -40 24 
             C -48 -15 -32 -50 0 -95 Z" 
          fill="url(#shieldGradient)"
          opacity="0.95"/>

    <!-- Central Diamond Star of Clarity -->
    <polygon points="0,-20 12,0 0,20 -12,0" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
